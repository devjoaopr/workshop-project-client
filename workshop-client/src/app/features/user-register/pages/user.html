<div class="bg-linear-to-br from-white to-green-800 w-screen h-screen flex flex-col">
  <header class="text-5xl tracking-tight font-semibold text-black p-4 flex flex-col">
  <span>
  Bem Vindo !
</span>
    <span class="text-lg font-light tracking-tight text-gray-700">
      Administre suas finanças de forma prática, Comece agora !
</span>
  </header>
  <div class=" flex flex-col justify-center items-end h-full  p-4">
<div class="w-150 h-2/4 flex flex-col shadow-2xl bg-white rounded-2xl ">
  <header class="text-xl text-green-900 flex flex-col p-4 font-thin tracking-tighter text-center">
    Crie sua conta
  </header>
  <section class="flex flex-col gap-2 p-4">
    <form [formGroup]="user" class="h-full flex flex-col gap-3">
      <label for="name" class="w-full">
        <span class="tracking-tight text-black text-xs uppercase">
          Nome:
        </span>
        <input type="text" formControlName="username" class=" border rounded-xl p-2 border-gray-400 text-black w-full" placeholder="Digite seu nome...">
      </label>
      <label for="email"  class="w-full">
        <span class="tracking-tight text-black text-xs uppercase" >
          Email:
        </span>
        <input type="email" formControlName="email" class=" border rounded-xl p-2 border-gray-400 text-black w-full" placeholder="Digite seu e-mail... ">
      </label>
      <label for="password" class="w-full">
        <span  class="tracking-tight text-black text-xs uppercase">
          Agora a senha:
        </span>
      <input type="password" formControlName="password" class=" border rounded-xl p-2 border-gray-400 text-black w-full" placeholder="Agora digite sua senha... ">
      </label>

      <div class="w-full justify-center flex flex-col items-center">

        <button type="button" (click)="createUser()" [disabled]="!user.valid" class=" p-4 w-fit bg-green-600 hover:bg-green-800 transition duration-500 text-white font-semibold py-2 rounded-xl tracking-tighter cursor-pointer">Criar Conta</button>

        <span>
          Já tem uma conta?
          <a (click)="goToLogin()" class="text-green-600 cursor-pointer hover:text-green-800 transition duration-500 hover:underline ">Login</a>
        </span>
      </div>
    </form>
  </section>

</div>

  </div>
</div>
